name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - if: startsWith(github.ref, 'refs/tags/v')
        run: cp LICENSE dist/
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: game
          path: dist

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FOLDER: newspeak-1984-${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: game
          path: ${{ env.FOLDER }}
      - run: zip -r "$FOLDER.zip" "$FOLDER"
      # Browsers refuse module scripts and font loads from file://, so the notes say how to serve it.
      - run: >
          gh release create "$GITHUB_REF_NAME" "$FOLDER.zip"
          --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          --notes "To play offline, unzip and serve the folder, for example with
          \`python3 -m http.server\` inside it, then open http://localhost:8000.
          Opening index.html directly does not work."

  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
